name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv python3-gi gir1.2-adw-1 shellcheck
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q pytest ruff
      - run: .venv/bin/ruff check src tests && .venv/bin/ruff format --check src tests
      - run: shellcheck -S warning install.sh scripts/*.sh tools/*.sh
      - run: bash tools/kit-check.sh && bash tools/check-version.sh
      - run: .venv/bin/python -m pytest tests/unit -q
      - name: the window's modules import (GTK 4, libadwaita)
        run: PYTHONPATH=src python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); import kiwi_template.ui.window"
      - name: new-app.sh makes a working app
        run: |
          cp -r . /tmp/new && cd /tmp/new
          bash tools/new-app.sh kiwi-notes "Kiwi Notes" eu.kiwinetwork.KiwiNotes someone
          bash tools/kit-check.sh && bash tools/check-version.sh
          PYTHONPATH=src "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest tests/unit -q
          test ! -e src/kiwi_template && test -f data/eu.kiwinetwork.KiwiNotes.desktop
