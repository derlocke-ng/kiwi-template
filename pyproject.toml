[project]
name = "kiwi-template"
version = "0.1.0"
description = "Starting point for a Kiwi Network desktop app: bash, Python, GTK 4"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

[tool.ruff]
line-length = 100
target-version = "py311"
# kiwi_icon.py is the kiwi-icons kit, copied unchanged (github.com/derlocke-ng/kiwi-icons).
extend-exclude = ["src/kiwi_template/kit/kiwi_icon.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
